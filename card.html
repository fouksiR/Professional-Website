<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FBF6E9">
<title>Dr Yuval Fouks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FDFAF1;
    --paper-2: #F5EFDE;
    --ink: #2A1F12;
    --ink-soft: #6B5942;
    --gold: #C49C3F;
    --gold-deep: #A8842F;
    --hairline: rgba(196, 156, 63, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background:
      radial-gradient(ellipse at 30% 20%, rgba(196, 156, 63, 0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(196, 156, 63, 0.03) 0%, transparent 50%),
      var(--paper);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 640px;
    aspect-ratio: 1.75 / 1;
    background: linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 36px 40px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 28px;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.8) inset,
      0 30px 60px -20px rgba(58, 38, 24, 0.18),
      0 8px 20px -10px rgba(58, 38, 24, 0.08);
    animation: enter 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes enter {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Decorative corner ornaments — very subtle */
  .card::before, .card::after {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    border: 1px solid var(--hairline);
    pointer-events: none;
  }
  .card::before {
    top: 10px; left: 10px;
    border-right: none; border-bottom: none;
    border-top-left-radius: 4px;
  }
  .card::after {
    bottom: 10px; right: 10px;
    border-left: none; border-top: none;
    border-bottom-right-radius: 4px;
  }

  .logo {
    width: 90px;
    height: 90px;
    object-fit: contain;
    display: block;
  }

  .name-link {
    text-align: center;
    text-decoration: none;
    color: var(--ink);
    display: block;
    transition: transform 0.3s ease;
  }
  .name-link:hover { transform: translateY(-1px); }

  .name {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: clamp(28px, 6vw, 42px);
    letter-spacing: 0.005em;
    line-height: 1;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .name em {
    font-style: italic;
    font-weight: 400;
    color: var(--ink);
  }

  .domain {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(13px, 2.4vw, 16px);
    letter-spacing: 0.22em;
    text-transform: lowercase;
    color: var(--gold-deep);
    transition: color 0.3s ease, letter-spacing 0.3s ease;
  }
  .name-link:hover .domain {
    color: var(--gold);
    letter-spacing: 0.28em;
  }

  .qr {
    width: 130px;
    height: 130px;
    display: block;
  }

  /* Mobile portrait — keep horizontal but compact */
  @media (max-width: 480px) {
    .card {
      padding: 22px 20px;
      gap: 14px;
      border-radius: 12px;
    }
    .logo { width: 60px; height: 60px; }
    .qr { width: 92px; height: 92px; }
    .name { font-size: 24px; }
    .domain { font-size: 12px; letter-spacing: 0.18em; }
  }

  @media (max-width: 360px) {
    .logo { width: 52px; height: 52px; }
    .qr { width: 78px; height: 78px; }
    .name { font-size: 21px; }
  }
</style>
</head>
