<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Dr Yuval Fouks — Card</title>

    <link rel="canonical" href="https://drfouks.com/card">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <meta name="description" content="Dr Yuval Fouks — Fertility Specialist & Reproductive Endocrinologist, Melbourne.">
    <meta property="og:title" content="Dr Yuval Fouks | Fertility Specialist">
    <meta property="og:description" content="Fertility specialist and reproductive endocrinologist based in Melbourne.">
    <meta property="og:image" content="https://drfouks.com/logo.png">
    <meta property="og:url" content="https://drfouks.com/card">
    <meta property="og:type" content="profile">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --cream-1: #f7f2e7;
            --cream-2: #ece6d5;
            --ink: #2a2218;
            --gold: #b89968;
            --gold-soft: #c9a878;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }

        body {
            background: radial-gradient(circle at 30% 20%, #f5efe2 0%, #e6dec8 100%);
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: 'Cormorant Garamond', 'EB Garamond', Garamond, serif;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .card {
            width: min(95vw, 920px);
            aspect-ratio: 1218 / 658;
            background: linear-gradient(135deg, var(--cream-1), var(--cream-2));
            border-radius: 14px;
            box-shadow:
                0 40px 80px -28px rgba(60, 40, 20, 0.22),
                0 12px 32px -12px rgba(60, 40, 20, 0.12);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-around;
            padding: 5% 6%;
            overflow: hidden;
            animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.45), transparent 55%);
            pointer-events: none;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(16px, 3.5%, 40px);
        }

        .logo {
            width: clamp(72px, 14vw, 150px);
            height: auto;
            aspect-ratio: 1;
            object-fit: contain;
            filter: drop-shadow(0 6px 14px rgba(120, 90, 130, 0.20));
        }

        .namegroup { text-align: center; }

        .name {
            font-size: clamp(28px, 5.6vw, 60px);
            font-weight: 400;
            line-height: 1;
            letter-spacing: 0.005em;
            white-space: nowrap;
        }
        .name em {
            font-style: italic;
            font-weight: 400;
        }

        .tagline {
            margin-top: 0.55em;
            font-style: italic;
            font-weight: 300;
            color: var(--gold);
            letter-spacing: 0.45em;
            font-size: clamp(13px, 1.8vw, 22px);
            text-indent: 0.45em; /* visual centering with letter-spacing */
        }

        .qr {
            width: clamp(108px, 17vw, 180px);
            aspect-ratio: 1;
            border: 1.6px solid var(--gold);
            border-radius: 50%;
            background: #fdf9f0;
            padding: 12%;
            display: grid;
            place-items: center;
            box-shadow: 0 10px 24px -14px rgba(60, 40, 20, 0.20);
        }
        .qr svg { width: 100%; height: auto; display: block; }
        .qr noscript a { color: var(--ink); font-size: 11px; text-decoration: none; }

        /* Mobile: keep proportions readable */
        @media (max-width: 480px) {
            .card { padding: 7% 5%; }
            .name { letter-spacing: 0; }
            .tagline { letter-spacing: 0.35em; }
        }

        /* Print: clean business-card output */
        @media print {
            body { background: white; padding: 0; }
            .card {
                width: 89mm;          /* standard business card */
                aspect-ratio: 89 / 51;
                box-shadow: none;
                border: 1px solid #e8e0cc;
                animation: none;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <main class="card" role="img" aria-label="Dr Yuval Fouks — Fertility Specialist business card">
        <div class="header">
            <img class="logo" src="/favicon-512.png" alt="" aria-hidden="true">
            <div class="namegroup">
                <h1 class="name">Dr <em>Yuval Fouks</em></h1>
                <p class="tagline">fertility</p>
            </div>
        </div>

        <div class="qr" aria-label="QR code linking to drfouks.com">
            <div id="qr-target"></div>
            <noscript><a href="https://drfouks.com">drfouks.com</a></noscript>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <script>
        (function () {
            try {
                var qr = qrcode(0, 'M');
                qr.addData('https://drfouks.com');
                qr.make();
                document.getElementById('qr-target').innerHTML =
                    qr.createSvgTag({ scalable: true, margin: 0 });
            } catch (e) {
                document.getElementById('qr-target').innerHTML =
                    '<a href="https://drfouks.com" style="font-size:11px;color:#2a2218;text-decoration:none;">drfouks.com</a>';
            }
        })();
    </script>
</body>
</html>
